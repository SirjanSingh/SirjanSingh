<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 224" width="1200" height="224" role="img" aria-label="LNMIIT · LUSIP, Research Intern  ·  Dr. Preety Singh, summer 2024">
  <style>
    .frame { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.4s ease-out .1s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .chip { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { to { opacity: 1 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(.8); opacity: .9 } 100% { transform: scale(2.2); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .frame,.chip,.pulse { animation: none; stroke-dashoffset: 0; opacity: 1 } }
  </style>
  <rect width="1200" height="224" fill="#1d2025"/>
  <line x1="236" y1="0" x2="236" y2="64" stroke="#ece8e0" stroke-opacity=".22"/>
  <path d="M236 56L244 64L236 72L228 64Z" fill="#e3a83f"/>
  <text x="206" y="62" text-anchor="end" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="15" letter-spacing="1.5" fill="#a3a7ae">SUMMER</text>
  <text x="206" y="90" text-anchor="end" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#ece8e0">2024</text>
  <rect class="frame" x="276" y="22" width="900" height="180" fill="none" stroke="#ece8e0" stroke-opacity=".2" pathLength="100"/>
  <line x1="246" y1="64" x2="276" y2="64" stroke="#ece8e0" stroke-opacity=".22" stroke-dasharray="2 4"/>
  <text x="302" y="62" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#ece8e0">LNMIIT · LUSIP</text>
  <text x="1154" y="58" text-anchor="end" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="13" letter-spacing="1.5" fill="#e3a83f">OPEN &#8599;</text>
  <text x="302" y="86" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="13" letter-spacing="1.5" fill="#4fb3c2">RESEARCH INTERN  ·  DR. PREETY SINGH</text>
  <text x="302" y="116" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#a3a7ae">A Selenium + ETL pipeline over 6,000+ Reddit pairs, and a neural sentiment classifier trained on it.</text>
  <g class="chip" style="animation-delay:0.50s"><rect x="302" y="168" width="89" height="22" fill="#262a30" stroke="#ece8e0" stroke-opacity=".15"/><text x="313" y="183" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="12" letter-spacing="1" fill="#ece8e0">SELENIUM</text></g>
