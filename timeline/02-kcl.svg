  <g class="chip" style="animation-delay:0.62s"><rect x="357" y="168" width="56" height="22" fill="#262a30" stroke="#ece8e0" stroke-opacity=".15"/><text x="368" y="183" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="12" letter-spacing="1" fill="#ece8e0">CLIP</text></g>
  <g class="chip" style="animation-delay:0.74s"><rect x="421" y="168" width="72" height="22" fill="#262a30" stroke="#ece8e0" stroke-opacity=".15"/><text x="432" y="183" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="12" letter-spacing="1" fill="#ece8e0">FUSION</text></g>
  <g class="chip" style="animation-delay:0.86s"><rect x="501" y="168" width="81" height="22" fill="#262a30" stroke="#ece8e0" stroke-opacity=".15"/><text x="512" y="183" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="12" letter-spacing="1" fill="#ece8e0">PYTORCH</text></g>
