  <text x="302" y="62" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#ece8e0">AARM Health Inc.</text>
  <text x="1154" y="58" text-anchor="end" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="13" letter-spacing="1.5" fill="#e3a83f">OPEN &#8599;</text>
  <text x="302" y="86" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="13" letter-spacing="1.5" fill="#4fb3c2">AI &amp; FULL STACK INTERN  ·  REMOTE, CALIFORNIA</text>
  <text x="302" y="116" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#a3a7ae">Built and shipped Maya, an LLM medical assistant with intent classification and an agentic pipeline,</text>
  <text x="302" y="139" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#a3a7ae">plus a write-path safety layer that controls what the model may commit.</text>
