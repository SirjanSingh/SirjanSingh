  <g class="chip" style="animation-delay:0.62s"><rect x="366" y="168" width="89" height="22" fill="#262a30" stroke="#ece8e0" stroke-opacity=".15"/><text x="377" y="183" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="12" letter-spacing="1" fill="#ece8e0">POSTGRES</text></g>
  <g class="chip" style="animation-delay:0.74s"><rect x="463" y="168" width="64" height="22" fill="#262a30" stroke="#ece8e0" stroke-opacity=".15"/><text x="474" y="183" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="12" letter-spacing="1" fill="#ece8e0">REACT</text></g>
