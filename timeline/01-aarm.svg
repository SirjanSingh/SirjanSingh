  <g class="chip" style="animation-delay:0.98s"><rect x="590" y="168" width="72" height="22" fill="#262a30" stroke="#ece8e0" stroke-opacity=".15"/><text x="601" y="183" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="12" letter-spacing="1" fill="#ece8e0">AGENTS</text></g>
