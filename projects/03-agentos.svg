<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="AgentOS. Watch an agent run as it happens, approve risky tool calls, and see which skill the cost and failures came from.">
  <style>
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2.4s ease-out .2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .flow { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(.7); opacity: .9 } 100% { transform: scale(2.4); opacity: 0 } }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .slide { animation: slide 6s linear infinite; }
    @keyframes slide { from { transform: translateX(0) } to { transform: translateX(-120px) } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.flow,.pulse,.fade,.slide { animation: none; stroke-dashoffset: 0; opacity: 1 }
    }
</style>
  <rect width="600" height="330" fill="#1d2025"/>
  <text x="28" y="38" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="11" fill="#6cbf8a" text-anchor="start" letter-spacing="1.8">LOCAL CONTROL PLANE FOR CLAUDE CODE</text>
  <text x="28" y="72" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="32" fill="#ece8e0" text-anchor="start" font-weight="700" letter-spacing="-.5">AgentOS</text>
  <defs><clipPath id="lane"><rect x="40" y="130" width="300" height="40"/></clipPath></defs>
  <line x1="40" y1="150" x2="560" y2="150" stroke="#5b6068"/>
  <g clip-path="url(#lane)"><g class="slide"><rect x="60" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="120" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="180" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="240" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="300" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="360" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="420" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="480" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="540" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="600" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="660" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="720" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="780" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="840" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="900" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="960" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="1020" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/><rect x="1080" y="141" width="26" height="18" fill="none" stroke="#6cbf8a" stroke-opacity=".7"/></g></g>
  <text x="40" y="124" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="start" letter-spacing="1.2">RUN EVENTS, LIVE OVER WEBSOCKET</text>
  <line x1="372" y1="116" x2="372" y2="184" stroke="#e3a83f" stroke-width="2"/>
  <rect x="332" y="141" width="26" height="18" fill="#e3a83f" fill-opacity=".25" stroke="#e3a83f"/>
  <circle class="pulse" cx="345" cy="150" r="9" fill="none" stroke="#e3a83f"/>
  <circle cx="394" cy="136" r="6" fill="none" stroke="#ece8e0"/><path d="M384 154 q10 -14 20 0" fill="none" stroke="#ece8e0"/>
  <text x="412" y="142" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#ece8e0" text-anchor="start" >sensitive tool waits</text>
  <text x="412" y="158" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#ece8e0" text-anchor="start" >for a human yes</text>
  <rect class="fade" style="animation-delay:0.4s" x="380" y="206" width="120" height="7" fill="#6cbf8a" fill-opacity=".55"/>
  <rect class="fade" style="animation-delay:0.6s" x="380" y="220" width="64" height="7" fill="#6cbf8a" fill-opacity=".55"/>
  <rect class="fade" style="animation-delay:0.8s" x="380" y="234" width="180" height="7" fill="#6cbf8a" fill-opacity=".55"/>
  <text x="372" y="216" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="end" >cost per</text>
  <text x="372" y="230" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="end" >skill</text>
  <text x="28" y="284" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#ece8e0" text-anchor="start" >Watch an agent run as it happens, approve risky tool calls, and see</text>
  <text x="28" y="305" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#ece8e0" text-anchor="start" >which skill the cost and failures came from.</text>
</svg>
