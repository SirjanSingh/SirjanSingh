<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="SurviveCity. Survival went from 15% to 60%, four times higher, after finding and closing 3 reward-hacking exploits.">
  <style>
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2.4s ease-out .2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .flow { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(.7); opacity: .9 } 100% { transform: scale(2.4); opacity: 0 } }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .slide { animation: slide 6s linear infinite; }
    @keyframes slide { from { transform: translateX(0) } to { transform: translateX(-120px) } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.flow,.pulse,.fade,.slide { animation: none; stroke-dashoffset: 0; opacity: 1 }
    }
</style>
  <rect width="600" height="330" fill="#1d2025"/>
  <text x="28" y="38" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="11" fill="#e3a83f" text-anchor="start" letter-spacing="1.8">MULTI-AGENT RL ON OPENENV</text>
  <text x="28" y="72" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="32" fill="#ece8e0" text-anchor="start" font-weight="700" letter-spacing="-.5">SurviveCity</text>
  <text x="572" y="38" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="11" fill="#e3a83f" text-anchor="end" letter-spacing="1.4">TOP 100 · META × PYTORCH</text>
  <line x1="70" y1="236" x2="540" y2="236" stroke="#5b6068"/>
  <line x1="70" y1="90" x2="70" y2="236" stroke="#5b6068"/>
  <text x="540" y="252" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="end" >GRPO + LoRA training on Qwen2.5-3B</text>
  <path class="draw" d="M70 202 C190 202 240 208 300 172 S400 110 540 100" stroke="#e3a83f" stroke-width="2.4" fill="none"/>
  <text x="62" y="206.0" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="13" fill="#ece8e0" text-anchor="end" font-weight="600">15%</text>
  <text x="540" y="88" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="13" fill="#e3a83f" text-anchor="end" font-weight="600">60%</text>
  <line x1="70" y1="100" x2="540" y2="100" stroke="#e3a83f" stroke-opacity=".25" stroke-dasharray="2 5"/>
  <text x="80" y="104" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="start" letter-spacing="1.2">SURVIVAL RATE</text>
  <circle class="pulse" cx="540" cy="100" r="6" fill="none" stroke="#e3a83f"/><circle cx="540" cy="100" r="4" fill="#e3a83f"/>
  <text x="28" y="284" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#ece8e0" text-anchor="start" >Survival went from 15% to 60%, four times higher, after finding and</text>
  <text x="28" y="305" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#ece8e0" text-anchor="start" >closing 3 reward-hacking exploits.</text>
</svg>
