<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="Vendable. Across 105 recorded negotiations, a 7-line statutory guard held every median on the published entitlement.">
  <style>
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2.4s ease-out .2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .flow { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(.7); opacity: .9 } 100% { transform: scale(2.4); opacity: 0 } }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .slide { animation: slide 6s linear infinite; }
    @keyframes slide { from { transform: translateX(0) } to { transform: translateX(-120px) } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.flow,.pulse,.fade,.slide { animation: none; stroke-dashoffset: 0; opacity: 1 }
    }
</style>
  <rect width="600" height="330" fill="#1d2025"/>
  <text x="28" y="38" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="11" fill="#e3a83f" text-anchor="start" letter-spacing="1.8">AGENT-TRANSACTABLE COMMERCE</text>
  <text x="28" y="72" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="32" fill="#ece8e0" text-anchor="start" font-weight="700" letter-spacing="-.5">Vendable</text>
  <line x1="40" y1="172" x2="560" y2="172" stroke="#5b6068" stroke-dasharray="2 5"/>
  <text x="560" y="190" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="end" >published entitlement</text>
  <path class="draw" d="M40 110 C70 80 90 150 120 120 S170 90 200 135 S250 110 280 150 S330 128 360 162" stroke="#ece8e0" stroke-opacity=".8" fill="none" stroke-width="1.6"/>
  <text x="40" y="98" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="start" >buyer keeps pushing</text>
  <path class="draw" style="animation-delay:1.4s" d="M360 162 C400 175 420 205 470 222 L560 230" stroke="#a3a7ae" stroke-opacity=".6" stroke-dasharray="5 5" fill="none"/>
  <text x="560" y="248" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="end" >prompt-only rule: talked down</text>
  <rect x="372" y="138" width="14" height="34" fill="#e3a83f"/>
  <text x="379" y="128" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#e3a83f" text-anchor="middle" letter-spacing="1.2">7-LINE GUARD, NO MODEL</text>
  <path class="draw" style="animation-delay:1.4s" d="M386 172 H560" stroke="#e3a83f" stroke-width="2.4" fill="none"/>
  <circle r="4" fill="#e3a83f"><animateMotion dur="4.5s" begin="0s" repeatCount="indefinite" path="M40 110 C70 80 90 150 120 120 S170 90 200 135 S250 110 280 150 S330 128 360 162 L372 172 H560"/></circle>
  <text x="28" y="284" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#ece8e0" text-anchor="start" >Across 105 recorded negotiations, a 7-line statutory guard held every</text>
  <text x="28" y="305" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#ece8e0" text-anchor="start" >median on the published entitlement.</text>
</svg>
