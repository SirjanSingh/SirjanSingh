<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="Cassandra. Catches hallucinations, prompt drift and tool-call failures in under 10 seconds, then proves the fix on the original failure.">
  <style>
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2.4s ease-out .2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .flow { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20 } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(.7); opacity: .9 } 100% { transform: scale(2.4); opacity: 0 } }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .slide { animation: slide 6s linear infinite; }
    @keyframes slide { from { transform: translateX(0) } to { transform: translateX(-120px) } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.flow,.pulse,.fade,.slide { animation: none; stroke-dashoffset: 0; opacity: 1 }
    }
</style>
  <rect width="600" height="330" fill="#1d2025"/>
  <text x="28" y="38" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="11" fill="#4fb3c2" text-anchor="start" letter-spacing="1.8">AGENT THAT SUPERVISES AGENTS</text>
  <text x="28" y="72" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="32" fill="#ece8e0" text-anchor="start" font-weight="700" letter-spacing="-.5">Cassandra</text>
  <text x="572" y="38" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="11" fill="#e3a83f" text-anchor="end" letter-spacing="1.4">1ST PLACE · ARIZE</text>
  <path class="draw" d="M48 140 H464" stroke="#5b6068" fill="none"/>
  <path class="fade" style="animation-delay:0.20s" d="M48 133L55 140L48 147L41 140Z" fill="#4fb3c2"/>
  <text x="48" y="122" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="middle" letter-spacing="1.2">TRACES</text>
  <path class="fade" style="animation-delay:0.45s" d="M152 133L159 140L152 147L145 140Z" fill="#ece8e0"/>
  <text x="152" y="122" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="middle" letter-spacing="1.2">CLASSIFY</text>
  <path class="fade" style="animation-delay:0.70s" d="M256 133L263 140L256 147L249 140Z" fill="#ece8e0"/>
  <text x="256" y="122" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="middle" letter-spacing="1.2">ADV. TESTS</text>
  <path class="fade" style="animation-delay:0.95s" d="M360 133L367 140L360 147L353 140Z" fill="#ece8e0"/>
  <text x="360" y="122" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="middle" letter-spacing="1.2">PATCH</text>
  <path class="fade" style="animation-delay:1.20s" d="M464 133L471 140L464 147L457 140Z" fill="#4fb3c2"/>
  <text x="464" y="122" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#a3a7ae" text-anchor="middle" letter-spacing="1.2">REPLAY</text>
  <path class="flow" d="M464 149 V194 H152 V149" stroke="#4fb3c2" stroke-opacity=".7" fill="none"/>
  <text x="308.0" y="212" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#4fb3c2" text-anchor="middle" >replay still fails? back to classify</text>
  <circle r="4" fill="#4fb3c2"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M48 140 H464 V194 H152 V140"/></circle>
  <path d="M474 140 H490" stroke="#ece8e0" stroke-opacity=".5"/>
  <text x="496" y="144" font-family="'IBM Plex Mono',Consolas,'SFMono-Regular',Menlo,monospace" font-size="10.5" fill="#ece8e0" text-anchor="start" letter-spacing="1">resolve</text>
  <text x="28" y="284" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#ece8e0" text-anchor="start" >Catches hallucinations, prompt drift and tool-call failures in under 10</text>
  <text x="28" y="305" font-family="'Schibsted Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#ece8e0" text-anchor="start" >seconds, then proves the fix on the original failure.</text>
</svg>
